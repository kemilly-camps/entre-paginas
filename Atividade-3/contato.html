<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre Páginas | Contato</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Contato</h1>
    <p>Entre em contato com a gente!</p>
    </header>
    
    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Resenhas</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section>
            <h2>Fale conosco</h2>
            <p>Tem alguma sugestão de leitura, dúvida ou opinião sobre algum livro? Envie sua mensagem para nós!</p>

            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Umberto Marcondes"><br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Ex: Umberto@gmail.com"><br><br>

                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" placeholder="Ex: Resenha de O Jantar Secreto" required><br><br>

                <label for="categoria">Categoria:</label>
                <select name="categoria" id="categoria" required>
                    <option value="">Selecione uma opção</option>
                    <option value="sugestao">Sugestão de leitura</option>
                    <option value="duvida">Dúvida</option>
                    <option value="opiniao">Opinião sobre uma resenha</option>
                    <option value="outro">Outro assunto</option>
                </select><br><br>

                <label for="comentario">Comentário:</label><br>
                <textarea name="comentario" id="comentario"required rows="5" cols="40" placeholder="Deixe aqui sua mensagem!"></textarea><br>

                <button type="submit">Enviar mensagem</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Entre Páginas</p>
    </footer>
</body>
</html>
